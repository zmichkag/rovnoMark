<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstraPrint | Планшет ОКК</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ZXing (Zebra Crossing) для сканирования из браузера -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased overflow-hidden select-none">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icons = {
        Scan: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>,
        List: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>,
        CameraOff: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>,
        Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>,
        Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
        Search: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    };

    const BarcodeScanner = ({ onDecode }) => {
        const videoRef = useRef(null);
        const [isScanning, setIsScanning] = useState(false);
        const [error, setError] = useState('');
        const codeReaderRef = useRef(null);

        useEffect(() => {
            codeReaderRef.current = new ZXing.BrowserMultiFormatReader();
            return () => {
                if (codeReaderRef.current) codeReaderRef.current.reset();
            };
        }, []);

        const startScanning = async () => {
            setError('');
            try {
                const videoInputDevices = await codeReaderRef.current.listVideoInputDevices();
                if (videoInputDevices.length === 0) {
                    setError('Камера не найдена на устройстве');
                    return;
                }

                const selectedDeviceId = videoInputDevices[videoInputDevices.length - 1].deviceId;

                setIsScanning(true);
                codeReaderRef.current.decodeFromVideoDevice(selectedDeviceId, videoRef.current, (result, err) => {
                    if (result) {
                        onDecode(result.text);
                        stopScanning();
                    }
                });
            } catch (err) {
                setError('Ошибка доступа к камере: ' + err.message);
                setIsScanning(false);
            }
        };

        const stopScanning = () => {
            if (codeReaderRef.current) {
                codeReaderRef.current.reset();
            }
            setIsScanning(false);
        };

        return (
            <div className="flex flex-col items-center justify-center w-full h-full bg-slate-900 rounded-2xl border border-slate-700 overflow-hidden relative">
                {error && <div className="absolute top-4 bg-rose-600 text-white px-4 py-2 rounded shadow-lg z-10 text-sm font-bold">{error}</div>}

                <video
                    ref={videoRef}
                    className={"w-full h-full object-cover " + (isScanning ? 'block' : 'hidden')}
                ></video>

                {!isScanning && (
                    <div className="flex flex-col items-center justify-center text-slate-500">
                        <Icons.CameraOff />
                        <span className="mt-4 text-lg font-bold">Камера выключена</span>
                        <p className="text-sm mt-2 max-w-sm text-center">Нажмите кнопку ниже, чтобы начать сканирование DataMatrix с упаковки.</p>
                    </div>
                )}

                <div className="absolute bottom-6 flex gap-4">
                    {!isScanning ? (
                        <button onClick={startScanning} className="bg-blue-600 active:bg-blue-800 text-white px-8 py-4 rounded-xl font-bold text-lg shadow-2xl flex items-center gap-2 border border-blue-400">
                            <Icons.Scan /> Включить Сканер
                        </button>
                    ) : (
                        <button onClick={stopScanning} className="bg-rose-600 active:bg-rose-800 text-white px-8 py-4 rounded-xl font-bold text-lg shadow-2xl border border-rose-400">
                            Остановить
                        </button>
                    )}

                    <button
                        onClick={() => { onDecode("0104600840749372215!IS(;93dGVz"); stopScanning(); }}
                        className="bg-slate-700 text-slate-300 px-4 py-4 rounded-xl font-bold text-sm shadow-xl border border-slate-600">
                        Симуляция скана
                    </button>
                </div>

                {isScanning && (
                    <div className="absolute inset-0 pointer-events-none border-[6px] border-blue-500/50 m-12 rounded-3xl"></div>
                )}
            </div>
        );
    };

    const App = () => {
        const [activeTab, setActiveTab] = useState('lines');
        const [scannedCode, setScannedCode] = useState(null);
        const [codeDetails, setCodeDetails] = useState(null);
        const [manualCode, setManualCode] = useState('');
        const [linesData, setLinesData] = useState([]);

        // Вытягивание живого списка активных линий
        const fetchLines = async () => {
            try {
                const res = await fetch('/api/dashboard/live');
                if (res.ok) {
                    const data = await res.json();
                    setLinesData(data.lines || []);
                }
            } catch(e) {}
        };

        useEffect(() => {
            fetchLines();
            const timer = setInterval(fetchLines, 3000);
            return () => clearInterval(timer);
        }, []);

        const handleDecode = async (code) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                oscillator.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 100);
            } catch (e) {}

            setScannedCode(code);
            setCodeDetails(null);

            try {
                const res = await fetch("/api/code/info?dm=" + encodeURIComponent(code));
                if (res.ok) {
                    const json = await res.json();
                    setCodeDetails(json);
                } else {
                    setCodeDetails({
                        product: "Код не найден в БД",
                        batch: "—",
                        line: "—",
                        printTime: "—",
                        status: "Отсутствует в текущих партиях",
                        valid: false
                    });
                }
            } catch(e) {
                setCodeDetails({
                    product: "Сбой сети API",
                    batch: "—",
                    line: "—",
                    printTime: "—",
                    status: "Ошибка подключения",
                    valid: false
                });
            }
        };

        const resetScanner = () => {
            setScannedCode(null);
            setCodeDetails(null);
        };

        const handleManualSubmit = (e) => {
            e.preventDefault();
            if (manualCode.trim()) {
                handleDecode(manualCode.trim());
                setManualCode('');
            }
        };

        return (
            <div className="h-screen w-screen flex flex-col bg-slate-950">
                <header className="bg-slate-900 border-b border-slate-800 p-4 shrink-0 flex justify-between items-center shadow-md z-10">
                    <div className="flex items-center gap-3">
                        <div className="bg-emerald-600 p-2 rounded-lg text-white"><Icons.Check /></div>
                        <div>
                            <h1 className="text-xl font-black text-white leading-none tracking-wide">AstraPrint <span className="text-emerald-500">ОКК</span></h1>
                            <span className="text-xs text-slate-400 font-mono uppercase">Терминал контроля качества</span>
                        </div>
                    </div>

                    <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                        <button
                            onClick={() => setActiveTab('lines')}
                            className={"flex items-center gap-2 px-6 py-3 rounded-lg text-sm font-bold transition-all " + (activeTab === 'lines' ? 'bg-slate-800 text-white shadow' : 'text-slate-500 active:bg-slate-800')}>
                            <Icons.List /> Мониторинг
                        </button>
                        <button
                            onClick={() => setActiveTab('scanner')}
                            className={"flex items-center gap-2 px-6 py-3 rounded-lg text-sm font-bold transition-all " + (activeTab === 'scanner' ? 'bg-blue-600 text-white shadow' : 'text-slate-500 active:bg-slate-800')}>
                            <Icons.Scan /> Аудит Камерой
                        </button>
                    </div>
                </header>

                <main className="flex-1 overflow-hidden p-6 relative">
                    {activeTab === 'lines' ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 h-full overflow-y-auto pb-20">
                            {linesData.map(line => (
                                <div key={line.line_id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-4 shadow-xl">
                                    <div className="flex justify-between items-start border-b border-slate-800 pb-4">
                                        <h2 className="text-2xl font-bold text-white">{line.line_name}</h2>
                                        <div className={"px-3 py-1 rounded font-bold text-xs " + (line.status === 'active' ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700/50' : 'bg-slate-800 text-slate-400')}>
                                            {line.status === 'active' ? 'РАБОТАЕТ' : 'ПРОСТОЙ'}
                                        </div>
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <span className="text-slate-500 text-sm">Шаблон / Продукция:</span>
                                        <span className="text-xl font-bold text-blue-400">
                                                {line.current_task ? line.current_task.template_name : 'Нет активной задачи'}
                                            </span>
                                    </div>
                                    <div className="bg-slate-950 rounded-xl p-4 border border-slate-800 flex flex-col gap-2 mt-auto font-mono text-xs">
                                        <span className="text-slate-500 uppercase font-bold">Прогресс смены:</span>
                                        <span className="text-emerald-400 font-bold text-base">
                                                {line.current_task ? (line.current_task.stats.printed + " / " + line.current_task.stats.total) : '0 / 0'}
                                            </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    ) : (
                        <div className="w-full h-full flex gap-6">
                            <div className="flex-1 h-full">
                                <BarcodeScanner onDecode={handleDecode} />
                            </div>

                            <div className="w-[450px] bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col shadow-2xl">
                                <h3 className="text-xl font-bold text-white border-b border-slate-800 pb-4 mb-4">Паспорт сканированного кода</h3>

                                {!scannedCode ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-slate-500">
                                        <Icons.Scan />
                                        <span className="mt-4 text-center font-bold">Ожидание сканирования...</span>

                                        <div className="w-full flex items-center gap-4 my-8 px-4 opacity-50">
                                            <div className="flex-1 border-t border-slate-700"></div>
                                            <span className="text-[10px] font-bold uppercase tracking-widest text-slate-500">ИЛИ</span>
                                            <div className="flex-1 border-t border-slate-700"></div>
                                        </div>

                                        <form onSubmit={handleManualSubmit} className="w-full flex flex-col gap-3">
                                            <label className="text-[10px] font-bold uppercase text-slate-500 tracking-wider">Ручной ввод кода</label>
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={manualCode}
                                                    onChange={(e) => setManualCode(e.target.value)}
                                                    placeholder="Введите код..."
                                                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-blue-500 transition-all placeholder:text-slate-700"
                                                />
                                                <button
                                                    type="submit"
                                                    disabled={!manualCode.trim()}
                                                    className="bg-blue-600 disabled:bg-slate-800 disabled:text-slate-600 text-white px-4 py-3 rounded-xl font-bold transition-all flex items-center justify-center hover:bg-blue-500 shadow-lg"
                                                >
                                                    <Icons.Search />
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-6">
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 break-all font-mono text-xs text-blue-300 shadow-inner">
                                            {scannedCode}
                                        </div>

                                        {codeDetails ? (
                                            <div className="flex flex-col gap-4 text-sm">
                                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                                    <span className="text-slate-500">Макет:</span>
                                                    <span className="font-bold text-white text-right">{codeDetails.product}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                                    <span className="text-slate-500">Задача:</span>
                                                    <span className="font-bold text-white">{"#" + codeDetails.batch}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                                    <span className="text-slate-500">Линия:</span>
                                                    <span className="font-bold text-white">{codeDetails.line}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                                    <span className="text-slate-500">Время печати:</span>
                                                    <span className="font-mono text-white">{codeDetails.printTime}</span>
                                                </div>
                                                <div className="flex justify-between border-b border-slate-800 pb-2">
                                                    <span className="text-slate-500">Статус:</span>
                                                    <span className={"font-bold " + (codeDetails.valid ? "text-emerald-400" : "text-rose-400")}>{codeDetails.status}</span>
                                                </div>

                                                <div className="mt-8 grid grid-cols-2 gap-4">
                                                    <button onClick={resetScanner} className="col-span-2 bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 py-4 rounded-xl font-bold transition-all shadow-lg">
                                                        СБРОС (СЛЕД. КОД)
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="flex-1 flex flex-col items-center justify-center text-blue-400 font-bold mt-10">
                                                <div className="h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                                Запрос паспорта кода...
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
