<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROVNO | Диспетчер v1.5 (Dev)</title>
    <!-- Tailwind CSS & React CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-300">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // Встроенные SVG-иконки для автономии без зависимостей Vite
    const IconActivity = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
    const IconSquare = () => <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>;

    function StatusBadge({ status }) {
        const styles = {
            printing: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20",
            ready: "bg-blue-500/10 text-blue-400 border-blue-500/20",
            initializing: "bg-amber-500/10 text-amber-400 border-amber-500/20",
            offline: "bg-red-500/10 text-red-400 border-red-500/20",
        };
        return (
            <span className={`px-2.5 py-1 rounded-full text-[10px] font-semibold border tracking-wider uppercase ${styles[status] || styles.offline}`}>
                    {status}
                </span>
        );
    }

    function RovnoDashboard() {
        const [data, setData] = useState({ lines: [], all_printers: [], logs: [] });
        const [tasks, setTasks] = useState([]);
        const [time, setTime] = useState(new Date().toLocaleTimeString());

        // Живой опрос Го-сервера (/api/printers и /api/task/active)
        const fetchData = async () => {
            try {
                const [resPrinters, resTasks] = await Promise.all([
                    fetch('/api/printers'),
                    fetch('/api/task/active')
                ]);

                if (resPrinters.ok) {
                    const pData = await resPrinters.json();
                    setData(pData);
                }
                if (resTasks.ok) {
                    const tData = await resTasks.json();
                    setTasks(Array.isArray(tData) ? tData : (tData.tasks || []));
                }
            } catch (e) {
                console.error("Fetch error:", e);
            }
        };

        useEffect(() => {
            fetchData();
            const timer = setInterval(() => {
                setTime(new Date().toLocaleTimeString());
                fetchData();
            }, 3000);
            return () => clearInterval(timer);
        }, []);

        return (
            <div className="min-h-screen bg-slate-950 text-slate-300 font-sans">
                <nav className="sticky top-0 z-50 bg-slate-900 border-b border-slate-800 px-6 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="bg-blue-600 p-2 rounded-lg text-white">
                            <IconActivity />
                        </div>
                        <div>
                            <h1 className="text-lg font-bold text-white leading-none">ROVNO</h1>
                            <span className="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Диспетчер v1.5 [Dev /frontend2]</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-4 text-xs">
                            <span className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                                <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Go Core: Online
                            </span>
                        <span className="font-mono text-slate-400">{time}</span>
                    </div>
                </nav>

                <main className="p-6 max-w-[1600px] mx-auto space-y-6">
                    {/* Активные задачи */}
                    <section>
                        <h2 className="text-lg font-semibold text-white mb-4">Текущие задания ({tasks.length})</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {tasks.map(t => {
                                const printed = t.stats?.printed || 0;
                                const total = t.stats?.total || 1;
                                const pct = Math.min(Math.round((printed / total) * 100), 100);
                                return (
                                    <div key={t.task_id} className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 flex flex-col gap-3">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className="text-slate-500 text-xs font-mono">#{t.task_id}</span>
                                                <h3 className="text-slate-200 font-medium text-sm">{t.line_name}</h3>
                                                <span className="bg-slate-700/50 text-slate-300 px-2 py-0.5 rounded text-xs">{t.template_name}</span>
                                            </div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-xs mb-1">
                                                <span className="text-slate-400">Прогресс</span>
                                                <span className="text-slate-200 font-mono">{printed} / {total} ({pct}%)</span>
                                            </div>
                                            <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-700">
                                                <div className="bg-emerald-500 h-2 rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                        </div>
                                    </div>
                            </div>
                            );
                            })}
                        </div>
                    </section>

                    {/* Парк принтеров */}
                    <section>
                        <h2 className="text-lg font-semibold text-white mb-4 mt-8">Парк принтеров</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {(data.all_printers || []).map(p => (
                                <div key={p.id} className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden flex flex-col p-4 gap-3 shadow-lg">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="text-slate-200 font-bold">{p.name}</h3>
                                            <p className="text-slate-400 text-xs font-mono">{p.ip}:{p.port}</p>
                                        </div>
                                        <StatusBadge status={p.status?.includes("ГОТОВ") || p.status?.includes("ПЕЧАТЬ") ? "ready" : "offline"} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 text-xs bg-slate-900/50 p-2 rounded border border-slate-700/50">
                                        <div><span className="text-slate-500 block">Драйвер:</span> <span className="font-mono">{p.driver_type}</span></div>
                                        <div><span className="text-slate-500 block">Риббон:</span> <span className="font-mono">{p.ribbon || '-'}</span></div>
                                        <div><span className="text-slate-500 block">Шаблон:</span> <span className="truncate block">{p.cur_template || '-'}</span></div>
                                        <div><span className="text-slate-500 block">Напечатано:</span> <span className="font-mono">{p.cur_count || 0}</span></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Логи */}
                    <section>
                        <div className="bg-[#0c0f17] border border-slate-800 rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs space-y-1">
                            {(data.logs || []).map((l, i) => (
                                <div key={i} className="text-slate-400 hover:bg-slate-800/30 px-1 rounded">
                                    [{l.time}] <span className="text-blue-400">{l.printer}</span>: {l.event}
                                </div>
                            ))}
                        </div>
                    </section>
                </main>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RovnoDashboard />);
</script>
</body>
</html>
