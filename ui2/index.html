<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RovnoMark | Line Control Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel для компиляции JSX в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased selection:bg-blue-500/30">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // Встроенные быстрые SVG Иконки (не требуют внешних пакетов)
    const Icons = {
        Activity: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>,
        Alert: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
        Stop: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0zM9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>,
        Clock: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
        Server: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/></svg>,
        WifiOff: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 010-7.072m0 0l2.829 2.829M3 3l18 18"/></svg>,
        Package: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>,
        Terminal: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
        Refresh: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
        Play: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
        Chart: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
    };

    const StatusBadge = ({ status, pulse = false }) => {
        const styles = {
            active: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
            ready: "bg-blue-500/10 text-blue-400 border-blue-500/30",
            idle: "bg-slate-700/50 text-slate-400 border-slate-600/50",
            error: "bg-rose-500/10 text-rose-400 border-rose-500/30",
        };

        const labels = {
            active: "В РАБОТЕ",
            ready: "ГОТОВ",
            idle: "ПРОСТОЙ",
            error: "АВАРИЯ",
        };

        const currentStyle = styles[status] || styles.idle;
        const currentLabel = labels[status] || (status ? status.toUpperCase() : "ПРОСТОЙ");

        return (
            <div className={"px-2.5 py-1 rounded-md text-xs font-bold border tracking-wider flex items-center gap-2 " + currentStyle}>
                {pulse && status === 'active' && (
                    <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                )}
                {pulse && status === 'error' && (
                    <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                </span>
                )}
                {currentLabel}
            </div>
        );
    };

    const PrinterMiniCard = ({ printer }) => {
        if (!printer) return null;

        const statusText = printer.status || "НЕИЗВЕСТНО";
        const isOffline = statusText.includes("ОФФЛАЙН") || statusText === "INITIALIZING" || statusText === "OFFLINE";

        const ribbonVal = printer.ribbon && !isNaN(parseInt(printer.ribbon)) ? parseInt(printer.ribbon) : null;
        const ribbonCritical = ribbonVal !== null && ribbonVal <= 15;
        const ribbonWarning = ribbonVal !== null && ribbonVal <= 30 && ribbonVal > 15;

        let ribbonColor = "bg-blue-500";
        if (ribbonCritical) ribbonColor = "bg-rose-500";
        else if (ribbonWarning) ribbonColor = "bg-amber-500";

        const queueVal = printer.queue_free !== undefined ? printer.queue_free : (printer.queue || 0);

        return (
            <div className={"p-3 rounded-lg border flex flex-col gap-2 transition-colors " +
                (isOffline ? 'bg-rose-950/10 border-rose-900/30' : 'bg-slate-900/50 border-slate-700/50 hover:bg-slate-800/80')}>

                <div className="flex justify-between items-start">
                    <div className="flex items-center gap-2">
                        {isOffline ? <Icons.WifiOff /> : <Icons.Server />}
                        <div>
                            <div className="text-sm font-bold text-slate-200 leading-none">{printer.name}</div>
                            <div className="text-[10px] text-slate-500 font-mono mt-1">{printer.ip}</div>
                        </div>
                    </div>
                    <span className={"text-[10px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider " +
                        (isOffline ? 'text-rose-400 bg-rose-400/10' :
                            statusText === "ПЕЧАТЬ" ? 'text-emerald-400 bg-emerald-400/10' : 'text-slate-400 bg-slate-800')}>
                  {statusText}
                </span>
                </div>

                {!isOffline && (
                    <div className="grid grid-cols-2 gap-3 mt-1 pt-2 border-t border-slate-700/50">
                        <div className="flex flex-col gap-1">
                            <div className="flex justify-between items-center text-[10px] text-slate-400 font-medium">
                                <span>Риббон</span>
                                <span className={ribbonCritical ? 'text-rose-400 font-bold' : ribbonWarning ? 'text-amber-400 font-bold' : 'text-slate-300'}>
                        {ribbonVal !== null ? ribbonVal + "%" : 'N/A'}
                      </span>
                            </div>
                            {ribbonVal !== null && (
                                <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div className={"h-full transition-all duration-1000 " + ribbonColor} style={{ width: ribbonVal + "%" }}></div>
                                </div>
                            )}
                        </div>

                        <div className="flex flex-col gap-1">
                            <div className="flex justify-between items-center text-[10px] text-slate-400 font-medium">
                                <span>Буфер</span>
                                <span className={queueVal < 10 ? 'text-amber-400 font-mono' : 'text-slate-300 font-mono'}>
                        {queueVal}
                      </span>
                            </div>
                            <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex">
                                <div className="h-full bg-indigo-500/50" style={{ width: Math.min((queueVal / 150) * 100, 100) + "%" }}></div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const TaskBlock = ({ task, onStop }) => {
        const stats = task.stats || { printed: 0, total: 1 };
        const printed = stats.printed || 0;
        const total = stats.total || 1;
        const percentage = Math.min(Math.round((printed / total) * 100), 100);

        return (
            <div className="bg-slate-950/40 rounded-xl p-4 border border-slate-800/80 shadow-inner flex flex-col gap-3">
                <div className="flex justify-between items-start">
                    <div>
                        <div className="flex items-center gap-2 mb-1">
                    <span className="bg-blue-500/20 text-blue-400 text-[10px] px-2 py-0.5 rounded font-mono font-bold tracking-wider">
                      {"ЗАДАНИЕ #" + task.task_id}
                    </span>
                            {task.eta && (
                                <span className="flex items-center gap-1 text-xs text-slate-400 font-mono">
                        <Icons.Clock /> {"ETA: " + task.eta}
                      </span>
                            )}
                        </div>
                        <h3 className="text-slate-200 font-semibold text-sm truncate" title={task.template_name}>
                            {task.template_name}
                        </h3>
                    </div>

                    <button
                        onClick={() => onStop && onStop(task.task_id)}
                        className="group flex items-center justify-center h-8 w-8 rounded-lg bg-slate-800 border border-slate-700 hover:bg-rose-500/20 hover:border-rose-500/50 transition-all"
                        title="Graceful Stop (Мягкая остановка партии)"
                    >
                        <Icons.Stop />
                    </button>
                </div>

                <div>
                    <div className="flex justify-between text-xs mb-1.5">
                        <span className="text-slate-400 font-medium">Прогресс партии</span>
                        <div className="font-mono">
                            <span className="text-white font-bold">{printed.toLocaleString()}</span>
                            <span className="text-slate-500">{" / " + total.toLocaleString()}</span>
                            <span className="text-emerald-400 ml-2 font-bold">{percentage + "%"}</span>
                        </div>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden border border-slate-800 shadow-inner">
                        <div
                            className="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full transition-all duration-1000 ease-out relative"
                            style={{ width: percentage + "%" }}
                        >
                            <div className="absolute top-0 right-0 bottom-0 left-0 bg-white/20 animate-pulse"></div>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const LineCard = ({ line, printerCatalog, onStopTask }) => {
        const printerIds = line.printers || [];

        return (
            <div className={"flex flex-col bg-slate-900 rounded-2xl border shadow-lg overflow-hidden transition-colors " +
                (line.status === 'error' ? 'border-rose-900/50 shadow-rose-900/10' : 'border-slate-800')}>

                <div className="px-5 py-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/80">
                    <div>
                        <h2 className="text-lg font-bold text-white tracking-tight leading-tight">{line.line_name}</h2>
                        <p className="text-xs text-slate-400 mt-0.5">{line.description || 'Линия упаковки'}</p>
                    </div>
                    <StatusBadge status={line.status} pulse={true} />
                </div>

                <div className="p-5 flex flex-col gap-5 flex-grow">
                    {line.current_task ? (
                        <TaskBlock task={line.current_task} onStop={onStopTask} />
                    ) : (
                        <div className="bg-slate-950/30 rounded-xl p-6 border border-dashed border-slate-800 text-center flex flex-col items-center justify-center text-slate-500 min-h-[120px]">
                            <Icons.Package />
                            <span className="text-sm font-medium mt-2">Нет активного задания от 1С</span>
                            <span className="text-xs font-mono mt-1 opacity-70">Ожидание команд...</span>
                        </div>
                    )}

                    <div>
                        <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">
                            {"Оборудование на линии (" + printerIds.length + ")"}
                        </h4>
                        <div className="grid grid-cols-1 gap-2">
                            {printerIds.map(pItem => {
                                const printerObj = typeof pItem === 'object' ? pItem : printerCatalog[pItem];
                                if (!printerObj) return null;
                                return <PrinterMiniCard key={printerObj.id} printer={printerObj} />;
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    function LineControlDashboard() {
        const [time, setTime] = useState("");
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);

        const handleStopTask = async (taskId) => {
            if (!confirm("Вы действительно хотите остановить задачу #" + taskId + "?")) return;
            try {
                const res = await fetch("/api/task/stop?task_id=" + taskId, { method: 'POST' });
                if (!res.ok) {
                    alert("Ошибка остановки: " + await res.text());
                } else {
                    fetchLiveData();
                }
            } catch (e) {
                alert("Сбой сети: " + e.message);
            }
        };

        const fetchLiveData = async () => {
            try {
                const res = await fetch('/api/dashboard/live');
                if (!res.ok) throw new Error("HTTP Status " + res.status);
                const json = await res.json();
                setData(json);
                setError(null);
            } catch (e) {
                setError(e.message);
            }
        };

        useEffect(() => {
            const updateTime = () => {
                const now = new Date();
                setTime(now.toLocaleTimeString('ru-RU', { hour12: false }));
            };
            updateTime();
            fetchLiveData();

            const clockTimer = setInterval(updateTime, 1000);
            const liveTimer = setInterval(fetchLiveData, 2000);

            return () => {
                clearInterval(clockTimer);
                clearInterval(liveTimer);
            };
        }, []);

        if (error && !data) {
            return (
                <div className="min-h-screen bg-slate-950 p-6 flex flex-col items-center justify-center text-rose-400 font-mono">
                    <Icons.Alert />
                    <div className="text-xl font-bold my-2">Сбой подключения к серверу RovnoMark</div>
                    <div className="bg-rose-950/40 border border-rose-900/50 p-4 rounded-xl text-xs max-w-lg text-center">
                        {error}
                    </div>
                </div>
            );
        }

        if (!data) {
            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center text-slate-500 font-mono">
                    <Icons.Refresh />
                    <span className="mt-2">Загрузка данных завода...</span>
                </div>
            );
        }

        const summary = data.summary || { active_tasks: 0, total_lines: 0, printers_offline: 0 };
        const lines = data.lines || [];
        const printerCatalog = data.printers || {};
        const logs = data.logs || [];

        return (
            <div className="min-h-screen bg-slate-950 text-slate-300 font-sans flex flex-col">

                {/* Шапка KPI */}
                <header className="sticky top-0 z-50 bg-slate-900 border-b border-slate-800 shadow-md">
                    <div className="px-6 mx-auto flex flex-col sm:flex-row sm:items-center justify-between py-3 gap-4">

                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-900/20">
                                <Icons.Activity />
                            </div>
                            <div>
                                <h1 className="text-lg font-black text-white leading-none tracking-wide">ROVNO</h1>
                                <span className="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Line Control v1.5</span>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 sm:gap-6">
                            <div className="flex items-center gap-3 bg-slate-950/50 px-4 py-1.5 rounded-lg border border-slate-800">
                                <Icons.Play />
                                <div>
                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Линии в работе</div>
                                    <div className="text-sm font-bold text-white">
                                        {summary.active_tasks} <span className="text-slate-600 text-xs font-normal">{"/ " + summary.total_lines}</span>
                                    </div>
                                </div>
                            </div>

                            <div className={"flex items-center gap-3 px-4 py-1.5 rounded-lg border " +
                                (summary.printers_offline > 0 ? 'bg-rose-500/10 border-rose-500/20' : 'bg-slate-950/50 border-slate-800')}>
                                <Icons.Alert />
                                <div>
                                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider font-mono">Алерты</div>
                                    <div className={"text-sm font-bold " + (summary.printers_offline > 0 ? 'text-rose-400' : 'text-slate-400')}>
                                        {summary.printers_offline > 0 ? summary.printers_offline + " Оффлайн" : 'Нет проблем'}
                                    </div>
                                </div>
                            </div>

                            <div className="text-base font-mono font-bold text-slate-300 ml-auto sm:ml-4 bg-slate-800/50 px-3 py-1 rounded-md border border-slate-700/50">
                                {time}
                            </div>
                        </div>
                    </div>
                </header>

                {/* Сетка линий */}
                <main className="p-6 mx-auto w-full max-w-[1920px] flex-grow flex flex-col">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 mb-6">
                        {lines.map(line => (
                            <LineCard
                                key={line.line_id}
                                line={line}
                                printerCatalog={printerCatalog}
                                onStopTask={handleStopTask}
                            />
                        ))}
                    </div>
                </main>

                {/* Лента событий (Логи) */}
                <footer className="mt-auto border-t border-slate-800 bg-[#0a0d14] p-4 shrink-0">
                    <div className="max-w-[1920px] mx-auto flex flex-col gap-2 h-32">
                        <div className="flex items-center justify-between text-xs text-slate-500 font-bold uppercase tracking-widest px-1">
                            <span className="flex items-center gap-2"><Icons.Terminal /> Live Event Stream</span>
                            <span className="flex items-center gap-1 text-[10px]"><Icons.Refresh /> Polling (2s)</span>
                        </div>

                        <div className="bg-slate-950 rounded-xl border border-slate-800/80 p-3 overflow-y-auto flex-grow font-mono text-xs space-y-1.5 shadow-inner">
                            {logs.length > 0 ? logs.map((log, i) => {
                                let colorClass = "text-slate-400";
                                if (log.type === "error") colorClass = "text-rose-400";
                                if (log.type === "warn") colorClass = "text-amber-400";
                                if (log.type === "success") colorClass = "text-emerald-400";
                                if (log.type === "info") colorClass = "text-blue-300";

                                return (
                                    <div key={i} className="flex items-start gap-3 hover:bg-slate-900/50 px-2 py-0.5 rounded -mx-2 transition-colors">
                                        <span className="text-slate-600 shrink-0">{"[" + log.time + "]"}</span>
                                        <span className="text-slate-300 font-semibold shrink-0 min-w-[120px] truncate">{log.printer}</span>
                                        <span className={colorClass + " break-all"}>{log.event}</span>
                                    </div>
                                );
                            }) : (
                                <div className="text-slate-600 italic">Ожидание системных событий...</div>
                            )}
                        </div>
                    </div>
                </footer>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LineControlDashboard />);
</script>
</body>
</html>
