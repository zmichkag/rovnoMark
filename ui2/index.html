<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstraPrint | Мониторинг Линий (Планшет)</title>
    <!-- Tailwind CSS & React CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 select-none antialiased">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // Светофорные статусы линий
    function LineStatusBadge({ status }) {
        const isRunning = status === 'active' || status === 'RUNNING';
        const isReady = status === 'ready';

        let colorClass = "bg-slate-800 text-slate-400 border-slate-700";
        let label = "ПРОСТОЙ";

        if (isRunning) {
            colorClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/40 animate-pulse";
            label = "ПЕЧАТЬ";
        } else if (isReady) {
            colorClass = "bg-blue-500/20 text-blue-400 border-blue-500/40";
            label = "ГОТОВ К СТАРТУ";
        }

        return (
            <span className={`px-3 py-1 rounded-md text-xs font-bold border tracking-wider uppercase ${colorClass}`}>
                {label}
            </span>
        );
    }

    function LiveDashboard() {
        const [data, setData] = useState(null);
        const [error, setError] = useState(null);
        const [time, setTime] = useState(new Date().toLocaleTimeString());

        // Живой опрос единого эндпоинта раз в 2 секунды
        const fetchLive = async () => {
            try {
                const res = await fetch('/api/dashboard/live');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const payload = await res.json();
                setData(payload);
                setError(null);
            } catch (e) {
                setError(e.message);
            }
        };

        useEffect(() => {
            fetchLive();
            const timer = setInterval(() => {
                setTime(new Date().toLocaleTimeString());
                fetchLive();
            }, 2000);
            return () => clearInterval(timer);
        }, []);

        if (error) {
            return (
                <div className="min-h-screen bg-slate-950 p-6 flex flex-col items-center justify-center text-red-400">
                    <div className="text-4xl font-black mb-2">⚠️ СБОЙ СВЯЗИ</div>
                    <div className="text-sm font-mono bg-red-950/50 p-4 rounded border border-red-800">
                        Не удалось получить данные с сервера: {error}
                    </div>
                </div>
            );
        }

        if (!data) {
            return (
                <div className="min-h-screen bg-slate-950 p-6 flex items-center justify-center text-slate-500 font-mono">
                    Загрузка контекста завода...
                </div>
            );
        }

        const { summary, lines, printers, logs } = data;

        return (
            <div className="min-h-screen bg-slate-950 text-slate-200 flex flex-col">
                {/* ВЕРХНЯЯ ПАНЕЛЬ KPI */}
                <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                    <div className="flex items-center gap-4">
                        <div className="bg-blue-600 text-white font-black text-xl px-3 py-1 rounded-lg">
                            ROVNO
                        </div>
                        <div>
                            <h1 className="text-base font-bold leading-none text-white">Диспетчер Линий</h1>
                            <span className="text-[10px] text-slate-400 font-mono">Оперативный контур смены</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-6">
                        <div className="flex gap-4 text-xs font-mono">
                            <div className="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                Активно задач: <b className="text-emerald-400">{summary.active_tasks}</b> / {summary.total_lines}
                            </div>
                            <div className="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                Принтеры Оффлайн: <b className={summary.printers_offline > 0 ? "text-red-400" : "text-slate-300"}>{summary.printers_offline}</b>
                            </div>
                        </div>
                        <div className="text-lg font-mono font-bold text-slate-400 bg-slate-950 px-3 py-1 rounded border border-slate-800">
                            {time}
                        </div>
                    </div>
                </header>

                {/* ОСНОВНАЯ СЕТКА ЛИНИЙ */}
                <main className="p-6 flex-1 max-w-[1920px] w-full mx-auto space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6">
                        {lines.map(line => {
                            const task = line.current_task;
                            const printed = task?.stats?.printed || 0;
                            const total = task?.stats?.total || 1;
                            const pct = Math.min(Math.round((printed / total) * 100), 100);

                            return (
                                <div key={line.line_id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between gap-4 shadow-xl">
                                    {/* Шапка линии */}
                                    <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                                        <div>
                                            <h2 className="text-xl font-bold text-white">{line.line_name}</h2>
                                            <span className="text-xs text-slate-500 font-mono">{line.description || 'Производственный участок'}</span>
                                        </div>
                                        <LineStatusBadge status={line.status} />
                                    </div>

                                    {/* Блок активной задачи */}
                                    {task ? (
                                        <div className="bg-slate-950/60 rounded-xl p-4 border border-slate-800/80 space-y-3">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <span className="text-xs font-mono text-blue-400 font-bold">Задание #{task.task_id}</span>
                                                    <div className="text-sm font-semibold text-slate-200">{task.template_name}</div>
                                                </div>
                                                <div className="text-right font-mono">
                                                    <div className="text-xl font-bold text-white">{printed} <span className="text-xs text-slate-500">/ {total}</span></div>
                                                    <div className="text-xs text-emerald-400 font-bold">{pct}%</div>
                                                </div>
                                            </div>

                                            {/* Прогресс бар */}
                                            <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700/50">
                                                <div className="bg-emerald-500 h-3 rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                        </div>
                                        </div>
                                        ) : (
                                        <div className="bg-slate-950/30 rounded-xl p-6 border border-dashed border-slate-800 text-center text-slate-600 text-sm font-mono">
                                        Задания от 1С отсутствуют (Линия простаивает)
                                        </div>
                                        )}

                        {/* Оборудование на линии */}
                            <div className="space-y-2">
                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Принтеры на линии ({line.printers.length})</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {line.printers.map(pID => {
                            const p = printers[pID];
                            if (!p) return null;
                            const isOffline = p.status.includes("ОФФЛАЙН") || p.status === "INITIALIZING";

                            return (
                                <div key={pID} className={`p-3 rounded-lg border text-xs flex justify-between items-center ${isOffline ? "bg-red-950/20 border-red-900/50" : "bg-slate-800/40 border-slate-700/50"}`}>
                                    <div>
                                        <div className="font-bold text-slate-200">{p.name}</div>
                                        <div className="text-[10px] text-slate-500 font-mono">{p.ip} ({p.driver_type})</div>
                                    </div>
                                    <div className="text-right font-mono">
                                        <div className={`font-bold ${isOffline ? "text-red-400" : "text-emerald-400"}`}>{p.status}</div>
                                        <div className="text-[10px] text-slate-400">Ribbon: {p.ribbon} | Q: {p.queue_free}</div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
            </div>
    </div>
    );
    })}
    </div>

    {/* ЛЕНТА СОБЫТИЙ */}
        <section className="bg-slate-900 border border-slate-800 rounded-xl p-4">
            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Оперативный журнал системных событий</h3>
            <div className="bg-slate-950 rounded-lg p-3 h-32 overflow-y-auto font-mono text-xs space-y-1 border border-slate-800">
                {logs.map((l, i) => (
                    <div key={i} className="text-slate-400 hover:bg-slate-900 px-1 rounded flex gap-3">
                        <span className="text-slate-600">[{l.time}]</span>
                        <span className="text-blue-400 font-bold">Принтер #{l.printer}</span>
                        <span className="text-slate-300">{l.event}</span>
                    </div>
                ))}
            </div>
        </section>
    </main>
    </div>
    );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LiveDashboard />);
</script>
</body>
</html>
