version: '3.8'

services:
  # Наше тестовое приложение (дев-ветка)
  rovno-app-test:
    build: .
    container_name: rovno-app-test
    command: [ "/bin/marking-service", "--debug", "--port", "8080" ]
    ports:
      - "8081:8080"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rovno-analytics-net

  # Тестовый сборщик метрик Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

networks:
  rovno-analytics-net:
    driver: bridge

volumes:
  prometheus-data: