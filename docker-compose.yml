# docker-compose.yml
services:
  rovnomark:
    build: .
    container_name: rovnomark-app-test
    command: ["/bin/marking-service", "--port", "8080", "--debug"]
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}" # Это поможет Promtail найти логи приложения

