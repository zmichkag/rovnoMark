version: '3.8'

services:
  # Наше тестовое приложение (дев-ветка)
  rovno-app-test:
    build: .
    container_name: rovno-app-test
    command: [ "/bin/marking-service", "--debug", "--port", "8080" ]
    ports:
      - "8081:8080"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - rovno-analytics-net

  # Тестовый сборщик метрик Prometheus
  prometheus-test:
    image: prom/prometheus:latest
    container_name: prometheus-test
    ports:
      - "9090:9090" # Сюда подключится ваша общая Grafana
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
    networks:
      - rovno-analytics-net

networks:
  rovno-analytics-net:
    driver: bridge