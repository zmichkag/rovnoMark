services:
  rovnomark:
    build: .
    container_name: rovnomark-app-test
    # Флаги можно передавать прямо здесь или оставить дефолты из CMD
    command: ["/bin/marking-service", "--port", "8000", "--debug", "--data-dir", "/app/data"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./data:/app/data
      # Если нужно монтировать кастомный UI:
      - ./ui2:/app/ui2
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
        max-size: "50m"
        max-file: "3"