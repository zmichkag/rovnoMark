# docker-compose.yml
services:
  rovnomark:
    build: .
    container_name: rovnomark-app
    command: ["/bin/marking-service", "--debug"]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    logging: # Указываем теги, чтобы Promtail легко их нашел
      driver: "json-file"
      options:
        tag: "{{.Name}}"
    restart: always

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always